# Builds Sho't Left for Android on GitHub's servers: no Android Studio needed on your computer.
# Run it from the repo's Actions tab ("Build Android" › Run workflow). The APK (and, once signing secrets are set,
# the signed .aab for Google Play) appear under the run's Artifacts.
name: Build Android
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      - name: Android SDK 36 (the runner already has the SDK; add the Android 16 platform)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Install the app shell
        working-directory: android-app
        shell: bash
        run: |
          set -o pipefail
          report() { echo "::error title=$1::$(tail -n 40 "$2" | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          { (cd .. && python3 build.py) && npm install --no-audit --no-fund --legacy-peer-deps && npx cap add android && npm run release-config && npm run sync; } 2>&1 | tee /tmp/install.log || { report install /tmp/install.log; exit 1; }
      - name: Signing key (only when the secrets are set)
        if: env.HAS_KEY == 'true'
        env: { KS: "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" }
        working-directory: android-app
        run: |
          echo "$KS" | base64 -d > shotleft-upload.jks
          printf "storeFile=../../shotleft-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${{ secrets.UPLOAD_STORE_PASSWORD }}" "${{ secrets.UPLOAD_KEY_ALIAS }}" "${{ secrets.UPLOAD_KEY_PASSWORD }}" > keystore.properties
      - name: Test APK (installs on any phone)
        working-directory: android-app/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log || { echo "::error title=gradle::$(grep -E 'error|Error|FAILURE|What went wrong' -A3 /tmp/gradle.log | tail -n 40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Signed release APK + AAB (when signing is set)
        if: env.HAS_KEY == 'true'
        working-directory: android-app/android
        run: ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shotleft-android
          path: |
            android-app/android/app/build/outputs/apk/**/*.apk
            android-app/android/app/build/outputs/bundle/release/*.aab
      - name: Keep the APK on the apk-builds branch (easy to fetch with git)
        shell: bash
        run: |
          mkdir /tmp/out && cp android-app/android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/shotleft-debug.apk
          cd /tmp/out && git init -q -b apk-builds && git add shotleft-debug.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-builds
